name: Deploy Admin API

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Cloud Run / Artifact Registry region"
        type: string
        required: true
        default: australia-southeast1

concurrency:
  group: deploy-admin-api
  cancel-in-progress: false

permissions:
  contents: read

env:
  GCP_PROJECT_ID: invest-dwh
  ARTIFACT_REPOSITORY: invest-monitoring
  CLOUD_RUN_SERVICE: invest-monitoring-admin-api
  DATABASE_SECRET: invest-database-writer-url
  MANAGEMENT_KEY_SECRET: invest-management-api-key
  RUNTIME_SERVICE_ACCOUNT: invest-admin-runtime@invest-dwh.iam.gserviceaccount.com
  # 価格と財務は分析層からしか読まない。管理APIは実データのParquetを読む。
  REAL_PARQUET_LAKE: "gs://invest-dwh-db-storage/lake"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify deployment prerequisites
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "${ARTIFACT_REPOSITORY}" \
            --project "${GCP_PROJECT_ID}" \
            --location "${{ inputs.region }}" >/dev/null
          gcloud secrets versions access latest \
            --secret "${DATABASE_SECRET}" \
            --project "${GCP_PROJECT_ID}" >/dev/null
          gcloud secrets versions access latest \
            --secret "${MANAGEMENT_KEY_SECRET}" \
            --project "${GCP_PROJECT_ID}" >/dev/null

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${{ inputs.region }}-docker.pkg.dev" --quiet

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ inputs.region }}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/admin-api:${GITHUB_SHA}"
          docker build --file backend/Dockerfile --tag "${image}" .
          docker push "${image}"
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"

      - name: Deploy private admin API
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${{ inputs.region }}" \
            --platform managed \
            --image "${IMAGE}" \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --port 8080 \
            --no-allow-unauthenticated \
            --set-env-vars "DATABASE_READ_ONLY=false,MANAGEMENT_API_ENABLED=true,PARQUET_LAKE=${REAL_PARQUET_LAKE}" \
            --set-secrets "DATABASE_URL=${DATABASE_SECRET}:latest,MANAGEMENT_API_KEY=${MANAGEMENT_KEY_SECRET}:latest" \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --concurrency 20 \
            --timeout 30

      - name: Permit deploy identity to verify the private service
        shell: bash
        run: |
          set -euo pipefail
          deploy_account="$(gcloud config get-value account)"
          gcloud run services add-iam-policy-binding "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${{ inputs.region }}" \
            --member "serviceAccount:${deploy_account}" \
            --role roles/run.invoker >/dev/null

      - name: Verify authentication and management access
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${{ inputs.region }}" \
            --format='value(status.url)')"
          actual_service_account="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${{ inputs.region }}" \
            --format='value(spec.template.spec.serviceAccountName)')"
          test "${actual_service_account}" = "${RUNTIME_SERVICE_ACCOUNT}"
          if curl --fail --show-error --silent "${url}/health" >/dev/null; then
            echo "Admin API unexpectedly allows unauthenticated access" >&2
            exit 1
          fi
          identity_token="$(gcloud auth print-identity-token --audiences="${url}")"
          management_key="$(gcloud secrets versions access latest \
            --secret "${MANAGEMENT_KEY_SECRET}" \
            --project "${GCP_PROJECT_ID}")"
          curl --fail --show-error --silent \
            --header "Authorization: Bearer ${identity_token}" \
            "${url}/ready" >/dev/null
          curl --fail --show-error --silent \
            --header "Authorization: Bearer ${identity_token}" \
            --header "X-Admin-Key: ${management_key}" \
            "${url}/api/data/runs?limit=1" >/dev/null
          echo "Admin API: ${url}" >> "${GITHUB_STEP_SUMMARY}"
